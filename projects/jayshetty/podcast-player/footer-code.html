<!-- Video Player JS (dual platform: YouTube postMessage + Spotify iFrame API).
     All handlers are delegated on document, so Finsweet filter/pagination
     re-renders need no re-init. Spotify controllers are created lazily on
     first click and pruned when their item leaves the DOM. -->
<script>
(function () {
  var DEBUG = false;

  /* ---------- Spotify iFrame API plumbing ---------- */
  var spotifyApi = window.__spotifyIframeApi || null;
  var pendingSpotifyPlays = []; // clicks that arrived before the API loaded
  var spotifyControllers = []; // { el: .podcast-list-spotify-embed wrapper, controller }

  document.addEventListener("spotify-api-ready", function () {
    spotifyApi = window.__spotifyIframeApi;
    pendingSpotifyPlays.splice(0).forEach(function (fn) { fn(); });
  });

  function episodeIdFrom(url) {
    var m = /episode\/([A-Za-z0-9]+)/.exec(url || "");
    return m ? m[1] : null;
  }

  /* The episode URL comes from the item's DOM: a data-spotify-url attribute
     if one is ever bound in Designer, otherwise the mobile watch button's
     CMS-bound Spotify link. */
  function spotifyUrlFor(item) {
    var el = item.querySelector("[data-spotify-url]");
    if (el) return el.getAttribute("data-spotify-url");
    var link = item.querySelector('a[href*="open.spotify.com/episode"]');
    return link ? link.getAttribute("href") : "";
  }

  /* WebKit gets a plain audio embed we build ourselves: Spotify's iFrame API
     makes Safari prompt to open the native app, and its /video embed is
     UA-gated to nothing. Cost is no programmatic play/pause there — the
     visitor presses play in the embed, and "pause others" tears it down.
     GestureEvent is WebKit-only, so this checks the engine, not the UA
     string, and catches iOS browsers too. See README for the evidence. */
  var USE_IFRAME_API = typeof window.GestureEvent === "undefined";

  /* The API only loads the audio embed; these are video podcasts, whose
     player is the /video URL (what Spotify's own oEmbed returns). Repoint
     the API's iframe there — same messaging protocol, so play()/pause()
     keep working. Built from the episode id, retried until the iframe
     exists (its creation timing varies by engine). */
  function controllerFor(embedWrap) {
    var entry = spotifyControllers.filter(function (e) { return e.el === embedWrap; })[0];
    return entry ? entry.controller : null;
  }

  /* WebKit path: our own iframe, mounted in place of the placeholder and
     torn back down to a placeholder when something else starts playing. */
  function mountPlainEmbed(item, embedWrap, id) {
    if (embedWrap.querySelector("iframe")) return;
    var placeholder = item.querySelector(".spotify-player-target");
    if (!placeholder || !placeholder.parentNode) return;
    var frame = document.createElement("iframe");
    frame.setAttribute("allow", "autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture");
    frame.style.border = "0";
    frame.src = "https://open.spotify.com/embed/episode/" + id;
    placeholder.parentNode.replaceChild(frame, placeholder);
  }

  function unmountPlainEmbed(embedWrap) {
    var frame = embedWrap.querySelector("iframe");
    if (!frame || !frame.parentNode) return;
    var placeholder = document.createElement("div");
    placeholder.className = "spotify-player-target";
    frame.parentNode.replaceChild(placeholder, frame);
  }

  /* Spotify's /video endpoint intermittently serves a dead card with no
     player (seen 19 Aug 2026 in plain Chrome, audio embed unaffected), so
     fall back to audio when that happens. A playback_update message proves
     a real player is running: it latches __videoOk, after which this embed
     never falls back. The clock starts on the video page's load event, so a
     slow network delays the deadline rather than tripping it. */
  var VIDEO_WATCHDOG_MS = 6000;

  function watchForDegradedVideo(embedWrap, id) {
    if (embedWrap.__videoWatchdog || embedWrap.__videoOk) return;

    var onMessage = function (e) {
      if (!e.data || (e.origin || "").indexOf("spotify.com") === -1) return;
      var payload = e.data;
      if (typeof payload === "string") {
        try { payload = JSON.parse(payload); } catch (err) { return; }
      }
      if (!payload || payload.type !== "playback_update") return;
      embedWrap.__videoOk = true; // real player: never fall back for this one
      stop();
    };

    var stop = function () {
      window.removeEventListener("message", onMessage);
      clearTimeout(embedWrap.__videoWatchdog);
      embedWrap.__videoWatchdog = null;
    };

    window.addEventListener("message", onMessage);
    embedWrap.__videoWatchdog = setTimeout(function () {
      stop();
      if (embedWrap.__videoOk) return;
      var frame = embedWrap.querySelector("iframe");
      /* Nothing to rescue if the item was re-rendered or torn down */
      if (!frame || !document.contains(frame) || frame.src.indexOf("/video") === -1) return;
      DEBUG && console.log("[player] /video page silent, using audio embed", id);
      embedWrap.__videoFellBack = true;
      frame.removeAttribute("sandbox");
      frame.src = "https://open.spotify.com/embed/episode/" + id;
    }, VIDEO_WATCHDOG_MS);
  }

  function useVideoEmbed(embedWrap, id, attempt) {
    if (!USE_IFRAME_API) return;
    if (embedWrap.__videoFellBack) return; // degraded /video page detected earlier
    var frame = embedWrap.querySelector("iframe");
    if (!frame) {
      if ((attempt || 0) < 30) {
        setTimeout(function () {
          useVideoEmbed(embedWrap, id, (attempt || 0) + 1);
        }, 100);
      }
      return;
    }
    var videoSrc = "https://open.spotify.com/embed/episode/" + id + "/video?utm_source=iframe-api";
    if (frame.src.indexOf("/embed/episode/" + id + "/video") !== -1) return;
    /* Covers engines where "ready" does not fire again after the repoint,
       and starts the degraded-video watchdog. */
    frame.addEventListener("load", function () {
      if (frame.src.indexOf("/video") === -1) return;
      var controller = controllerFor(embedWrap);
      if (controller) {
        try { controller.play(); } catch (err) {}
      }
      watchForDegradedVideo(embedWrap, id);
    });
    /* Minimum tokens the embed needs; leaving out allow-popups and
       allow-top-navigation blocks its "Watch on Spotify" app handoff. */
    frame.setAttribute("sandbox", "allow-scripts allow-same-origin allow-presentation");
    frame.src = videoSrc;
  }

  function pruneControllers() {
    spotifyControllers = spotifyControllers.filter(function (entry) {
      if (document.contains(entry.el)) return true;
      try { entry.controller.destroy(); } catch (err) {}
      return false; // item was re-rendered away by Finsweet
    });
  }

  function pauseAllSpotify() {
    if (!USE_IFRAME_API) {
      document.querySelectorAll(".podcast-list-spotify-embed").forEach(unmountPlainEmbed);
      return;
    }
    pruneControllers();
    spotifyControllers.forEach(function (entry) {
      try { entry.controller.pause(); } catch (err) {}
    });
  }

  function pauseAllYouTube() {
    document.querySelectorAll(".podcast-list-youtube-embed iframe").forEach(function (frame) {
      if (frame.contentWindow) {
        frame.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', "*");
      }
    });
  }

  function pauseEverything() {
    pauseAllYouTube();
    pauseAllSpotify();
  }

  /* ---------- shared button-state UI (same classes as before) ---------- */
  function clearShowBtn() {
    document.querySelectorAll(".podcasts_video-wrapper.show-btn").forEach(function (w) {
      w.classList.remove("show-btn");
    });
  }

  function markPlaying(watchBtn) {
    clearShowBtn();
    var wrapper = watchBtn.closest(".podcasts_video-wrapper");
    if (wrapper) wrapper.classList.add("show-btn");
    var block = watchBtn.closest(".podcast-block") || watchBtn.closest(".podcasts_item");
    if (block) {
      var img = block.querySelector(".podcasts_image-wrapper");
      if (img) img.classList.add("videoplay");
    }
  }

  /* ---------- per-item players ---------- */
  function playYouTube(item, watchBtn) {
    pauseEverything();
    var embed = item.querySelector(".podcast-list-youtube-embed");
    if (embed) embed.classList.add("visible");
    markPlaying(watchBtn);
    var frame = item.querySelector(".podcast-list-youtube-embed iframe");
    if (frame && frame.contentWindow) {
      frame.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', "*");
    }
  }

  function playSpotify(item, watchBtn) {
    pauseEverything();
    var embedWrap = item.querySelector(".podcast-list-spotify-embed");
    markPlaying(watchBtn);
    if (!embedWrap) return;
    embedWrap.classList.add("visible");

    var id = episodeIdFrom(spotifyUrlFor(item));
    if (!id) {
      DEBUG && console.log("[player] no Spotify episode id on", embedWrap);
      return;
    }

    if (!USE_IFRAME_API) {
      mountPlainEmbed(item, embedWrap, id);
      return;
    }

    var existing = spotifyControllers.filter(function (entry) {
      return item.contains(entry.el);
    })[0];
    if (existing) {
      existing.controller.play();
      return;
    }

    var run = function () {
      var placeholder = item.querySelector(".spotify-player-target");
      if (!placeholder || !spotifyApi) return;
      spotifyApi.createController(placeholder, {
        uri: "spotify:episode:" + id,
        width: "100%",
        height: "100%"
      }, function (controller) {
        /* Key the registry off the wrapper: createController replaces the
           placeholder, but the wrapper stays put */
        spotifyControllers.push({ el: embedWrap, controller: controller });
        /* "ready" fires per embed page load; playing against a page already
           being replaced is harmless, and the video page's ready follows */
        controller.addListener("ready", function () {
          useVideoEmbed(embedWrap, id);
          try { controller.play(); } catch (err) {}
        });
      });
      /* Also driven here, not only from the callback, so callback timing
         cannot lose the swap. No-op once already on the video embed. */
      useVideoEmbed(embedWrap, id);
    };
    spotifyApi ? run() : pendingSpotifyPlays.push(run);
  }

  function pauseItem(item, platform) {
    if (platform === "spotify") {
      if (USE_IFRAME_API) {
        pruneControllers();
        spotifyControllers.forEach(function (entry) {
          if (item.contains(entry.el)) {
            try { entry.controller.pause(); } catch (err) {}
          }
        });
      } else {
        var wrap = item.querySelector(".podcast-list-spotify-embed");
        if (wrap) unmountPlainEmbed(wrap);
      }
    } else {
      var frame = item.querySelector(".podcast-list-youtube-embed iframe");
      if (frame && frame.contentWindow) {
        frame.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', "*");
      }
    }
    var shown = item.querySelector(".podcasts_video-wrapper.show-btn");
    if (shown) shown.classList.remove("show-btn");
  }

  function isConditionallyHidden(btn) {
    var wrapper = btn.closest(".podcasts_video-wrapper");
    return btn.classList.contains("w-condition-invisible") ||
      (wrapper && wrapper.classList.contains("w-condition-invisible"));
  }

  /* ---------- delegated events (survive Finsweet re-renders) ---------- */
  document.addEventListener("click", function (e) {
    if (!e.target || !e.target.closest) return;

    var watch = e.target.closest(".is-podcast-watch-button");
    if (watch) {
      var item = watch.closest(".podcasts_item") || watch.closest(".podcast-block");
      if (!item) return;
      /* Buttons without data-watch (legacy/featured) behave as YouTube */
      var platform = watch.getAttribute("data-watch") || "youtube";
      platform === "spotify" ? playSpotify(item, watch) : playYouTube(item, watch);
      return;
    }

    var pauseBtn = e.target.closest(".is-podcast-pause-button");
    if (pauseBtn) {
      var pItem = pauseBtn.closest(".podcasts_item") || pauseBtn.closest(".podcast-block");
      if (pItem) pauseItem(pItem, pauseBtn.getAttribute("data-pause") || "youtube");
      return;
    }

    /* Omny Listen button: keep the show-btn choreography it had before */
    var playBtn = e.target.closest(".is-podcast-play-button");
    if (playBtn) {
      clearShowBtn();
      var playWrapper = playBtn.closest(".podcasts_video-wrapper");
      if (playWrapper) playWrapper.classList.add("show-btn");
      return;
    }

    var cover = e.target.closest(".image-cover");
    if (cover) {
      var cItem = cover.closest(".podcasts_item") || cover.closest(".podcast-block");
      if (!cItem) return;
      var imgWrap = cover.closest(".podcasts_image-wrapper");
      if (imgWrap) imgWrap.classList.add("showvideo");
      /* Route to whichever watch button Webflow's conditional visibility
         shows for this item's era */
      var buttons = cItem.querySelectorAll(".is-podcast-watch-button");
      for (var i = 0; i < buttons.length; i++) {
        if (!isConditionallyHidden(buttons[i])) {
          buttons[i].click();
          break;
        }
      }
    }
  });

  /* The untouched Omny block still binds $("body").on("click",
     ".is-podcast-watch-button", …) to pause Omny players when a watch
     button is pressed — no extra interop needed here. */

  /* EP 853's Omny Podcast Link field held a Spotify web-player URL (fixed in
     the CMS 19 Aug 2026). Framing open.spotify.com made Safari ask to open
     the native app on every page load. Drop any non-Omny "Omny" embed so the
     same data slip cannot do it again; re-run on the beat Omny re-inits. */
  function dropNonOmnyEmbeds() {
    document.querySelectorAll("iframe.omny-embed").forEach(function (frame) {
      if ((frame.src || "").indexOf("omny.fm") === -1) frame.remove();
    });
  }

  dropNonOmnyEmbeds();
  document.addEventListener("click", function (e) {
    if (!e.target || !e.target.closest) return;
    if (e.target.closest(".podcast-pagination-button, .category-item")) {
      setTimeout(dropNonOmnyEmbeds, 1200);
    }
  });
})();
</script>
<script>
  $(document).ready(function () {
    var allDataAttribute = document.querySelectorAll("[data-omny-embed-id]");
    $.each(allDataAttribute, function (i, value) {

    });

    });

<script>
  function initPlayer() {
    const playerList = {};

    // store all running players
    const currentPlayingList = {};

    const playButtons = document.querySelectorAll(".is-podcast-play-button");
    playButtons.forEach((playButton) => {
      // create player
      const player = new playerjs.Player(
        document.getElementById(playButton.getAttribute("data-omny-embed-id"))
      );

      // store player to player list
      playerList[playButton.getAttribute("data-omny-embed-id")] = player;

      // add player to running player list o play
      player.on("play", () => {
        if (!currentPlayingList[playButton.getAttribute("data-omny-embed-id")])
          currentPlayingList[playButton.getAttribute("data-omny-embed-id")] =
            player;
      });

      // remove player to running player list o play
      player.on("pause", () => {
        if (currentPlayingList[playButton.getAttribute("data-omny-embed-id")]) {
          delete currentPlayingList[
            playButton.getAttribute("data-omny-embed-id")
          ];
        }
      });

      playButton.addEventListener("click", () => {
        $(".podcast-list-youtube-embed iframe").each(function () {
          $(this)[0].contentWindow.postMessage(
            '{"event":"command","func":"' + "pauseVideo" + '","args":""}',
            "*"
          );

          if (Object.keys(currentPlayingList).length > 0) {
            Object.values(currentPlayingList).forEach((p) => p.pause());
          }
          // start new player
          /*setTimeout(function () {
            playerList[playButton.getAttribute("data-omny-embed-id")].play();
          }, 1000); */
        });
        // pause currently running players
      });
			 $(".podcast-player_close").click(function () {
      Object.values(currentPlayingList).forEach((p) => p.pause());
    });
    $("body").on("click", ".is-podcast-watch-button", function () {
      Object.values(currentPlayingList).forEach((p) => p.pause());
    });

    });

  }

  $(document).ready(function () {
    // store all player
    initPlayer();
    $(".podcast-pagination-button, .category-item").on("click", function () {

        setTimeout(function () {

        var allDataAttribute = document.querySelectorAll(
            "[data-omny-embed-id]"
        );
        $.each(allDataAttribute, function (i, value) {
            $(this).attr("data-omny-embed-id", "omny-embed-" + (i + 1));
        });
        var allIframePlayer = document.querySelectorAll("iframe.omny-embed");
        $.each(allIframePlayer, function (i, value) {
            $(this).prop("id", "omny-embed-" + (i + 1));
        });
            initPlayer();
        }, 1000);
    });

  });
</script>
