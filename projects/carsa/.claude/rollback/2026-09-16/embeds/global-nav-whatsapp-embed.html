<!-- In-canvas Embed captured from the live HTML on 16 Sep 2026: every page (nav component). Not readable via the Webflow API; stays in Webflow. -->
<script>
(function () {
    var wa = document.getElementById('nav_open-whatsapp');
    if (!wa) return;
    // VRM only exists on a VDP: /vehicles/used/<vrm>
    var m = location.pathname.match(/\/vehicles\/used\/([a-z0-9]+)/i);
    var vrm = m ? m[1].toUpperCase() : '';
    var msg = vrm ? 'Hi, please tell me more about ' + vrm : 'Hi, I have a question about a car on your website';
    wa.href = 'https://wa.me/442046322989?text=' + encodeURIComponent(msg);
  })();
</script>
