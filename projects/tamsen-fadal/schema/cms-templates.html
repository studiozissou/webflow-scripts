<!--
  CMS TEMPLATE SCHEMA — Tamsen Fadal
  ==================================
  PASTE-READY. Uses Webflow's real dynamic-binding token format, so these can be
  pasted directly without touching the "+" field picker.

  WHERE: Collection Page template → Page Settings → the JSON-LD schema field.
  Paste the whole block including the <script> tags — that is how Webflow stores it
  (CMS templates keep a raw string in rawJsonLdSchema, script tags included).

  TOKEN FORMAT — all four parts are load-bearing:
      {{wf {&quot;path&quot;:&quot;field-slug&quot;,&quot;type&quot;:&quot;PlainText&quot;\} }}
      1. "{{wf " prefix, not bare "{{"
      2. HTML-entity quotes (&quot;) inside, not raw "
      3. path = the field SLUG (lowercase, hyphenated), never the display name
      4. "\}" backslash-escaped inner brace, then a space, then "}}"

  Bare {{ field }} is rejected by Webflow — "Contains invalid {{ variables }} that
  will render as empty when published."

  Every slug below was read from the live collection via Webflow MCP on 2026-08-10.
  Built-in fields (published-on, updated-on) do not appear in the API field list but
  are always available.

  Requires: the site-wide entity graph live in Site Settings → Custom Code → Head,
  so #person / #publisher / #website resolve. That is already deployed.

  ⚠️ Validate one real published item per template before rolling out. A malformed
  token fails silently — it renders an empty string rather than erroring.
-->


<!-- ══════════════════════════════════════════════════════════════════════
     1. PODCAST EPISODES  →  /podcast/[slug]
     Collection "Podcast Episodes" · template page id 68a5993943f9f66c9d22b4d2
     103 pages, currently no page-specific type. Biggest single gap.

     Slugs: name, slug, short-description, featured-image, release-date,
            episode-number, guest, keywords

     ── WHY contributor, NOT actor ──────────────────────────────────────
     schema.org has no podcast-specific "guest" property. The candidates:
       actor       "An actor (individual or a group), e.g. in TV, radio, movie,
                    video games etc., or in an event."  → implies performing a
                    role; an interviewee is not acting
       contributor "A secondary contributor to the CreativeWork or Event."
                    → exactly what a podcast guest is
     No rich result depends on either — Google's podcast support reads RSS, not
     JSON-LD — so the semantically correct property wins. The block this replaces
     used actor; that was inherited, not chosen.

     ⚠️ DATA ISSUE — solo episodes list guest = "Tamsen Fadal"
     Checked all 100 published episodes: the guest field is never empty, and
     multi-guest is a non-issue (the only comma is a credential, "Sharon Malone, MD").
     BUT roughly a quarter of episodes are solo and carry "Tamsen Fadal" as the guest.

     On those, this markup emits an inline Person named "Tamsen Fadal" as contributor
     while author already points at #person — a second, unlinked node for the same
     human. That is the exact entity fragmentation this project is fixing, just at
     smaller scale.

     Webflow's binding tokens cannot do conditionals, so this cannot be solved in
     markup. Options, best first:
       1. Add a "Guest URL" field to the collection and bind it to sameAs. This both
          fixes the duplicate (Tamsen's URL resolves to her own site) and is the
          genuinely high-value change — it lets Google resolve guests as real
          entities, strengthening co-occurrence signal around Tamsen.
       2. Accept it. Redundant but not false — she does contribute to her own episode.
       3. Do NOT simply clear guest on solo episodes: an empty field renders
          "name": "" , and an empty-name Person node is worse than a redundant one.
     ══════════════════════════════════════════════════════════════════════ -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "PodcastEpisode",
      "@id": "https://www.tamsenfadal.com/podcast/{{wf {&quot;path&quot;:&quot;slug&quot;,&quot;type&quot;:&quot;PlainText&quot;\} }}#episode",
      "name": "{{wf {&quot;path&quot;:&quot;name&quot;,&quot;type&quot;:&quot;PlainText&quot;\} }}",
      "description": "{{wf {&quot;path&quot;:&quot;short-description&quot;,&quot;type&quot;:&quot;PlainText&quot;\} }}",
      "image": "{{wf {&quot;path&quot;:&quot;featured-image&quot;,&quot;type&quot;:&quot;ImageRef&quot;\} }}",
      "datePublished": "{{wf {&quot;path&quot;:&quot;release-date&quot;,&quot;type&quot;:&quot;Date&quot;\} }}",
      "episodeNumber": "{{wf {&quot;path&quot;:&quot;episode-number&quot;,&quot;type&quot;:&quot;Number&quot;\} }}",
      "url": "https://www.tamsenfadal.com/podcast/{{wf {&quot;path&quot;:&quot;slug&quot;,&quot;type&quot;:&quot;PlainText&quot;\} }}",
      "keywords": "{{wf {&quot;path&quot;:&quot;keywords&quot;,&quot;type&quot;:&quot;PlainText&quot;\} }}",
      "partOfSeries": { "@id": "https://www.tamsenfadal.com/podcast#podcast" },
      "author": { "@id": "https://www.tamsenfadal.com/#person" },
      "publisher": { "@id": "https://www.tamsenfadal.com/#publisher" },
      "inLanguage": "en",
      "contributor": {
        "@type": "Person",
        "name": "{{wf {&quot;path&quot;:&quot;guest&quot;,&quot;type&quot;:&quot;PlainText&quot;\} }}"
      }
    },
    {
      "@type": "BreadcrumbList",
      "@id": "https://www.tamsenfadal.com/podcast/{{wf {&quot;path&quot;:&quot;slug&quot;,&quot;type&quot;:&quot;PlainText&quot;\} }}#breadcrumb",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.tamsenfadal.com/" },
        { "@type": "ListItem", "position": 2, "name": "Podcast", "item": "https://www.tamsenfadal.com/podcast" },
        { "@type": "ListItem", "position": 3, "name": "{{wf {&quot;path&quot;:&quot;name&quot;,&quot;type&quot;:&quot;PlainText&quot;\} }}", "item": "https://www.tamsenfadal.com/podcast/{{wf {&quot;path&quot;:&quot;slug&quot;,&quot;type&quot;:&quot;PlainText&quot;\} }}" }
      ]
    }
  ]
}
</script>


<!-- ══════════════════════════════════════════════════════════════════════

     so location cannot be a structured PostalAddress. Google accepts the raw string.
     Splitting that CMS field would give noticeably better Event rich results.

     fabricated. Rich Results Test flags "missing field offers (optional)" —
