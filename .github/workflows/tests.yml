# The gate on main: hermetic unit tests for the frozen client folders. No network, no secrets.

name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit tests and generated-file check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: RHP
        run: npm run test:rhp

      - name: TSC
        run: npm run test:tsc

      - name: Jay Shetty
        run: npm run test:jayshetty
