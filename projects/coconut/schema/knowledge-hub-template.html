<!-- Knowledge Hub article template JSON-LD (BlogPosting + BreadcrumbList), placed in the template's Page Settings > Custom code > Head after the Finsweet script and styles; the Schema markup field stays empty. -->
<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "@id": "https://www.getcoconut.com/knowledge-hub/{{wf {&quot;path&quot;:&quot;slug&quot;,&quot;type&quot;:&quot;PlainText&quot;\} }}#article",
    "mainEntityOfPage": "https://www.getcoconut.com/knowledge-hub/{{wf {&quot;path&quot;:&quot;slug&quot;,&quot;type&quot;:&quot;PlainText&quot;\} }}",
    "url": "https://www.getcoconut.com/knowledge-hub/{{wf {&quot;path&quot;:&quot;slug&quot;,&quot;type&quot;:&quot;PlainText&quot;\} }}",
    "headline": "{{wf {&quot;path&quot;:&quot;name&quot;,&quot;type&quot;:&quot;PlainText&quot;\} }}",
    "description": "{{wf {&quot;path&quot;:&quot;post-summary&quot;,&quot;type&quot;:&quot;PlainText&quot;\} }}",
    "image": {
      "@type": "ImageObject",
      "url": "{{wf {&quot;path&quot;:&quot;featured-image&quot;,&quot;type&quot;:&quot;ImageRef&quot;\} }}"
    },
    "datePublished": "{{wf {&quot;path&quot;:&quot;publication-date&quot;,&quot;type&quot;:&quot;Date&quot;\} }}",
    "dateModified": "{{wf {&quot;path&quot;:&quot;updated-on&quot;,&quot;type&quot;:&quot;Date&quot;\} }}",
    "author": {
      "@type": "{{wf {&quot;path&quot;:&quot;author:schema-type&quot;,&quot;type&quot;:&quot;PlainText&quot;\} }}",
      "@id": "https://www.getcoconut.com/author/{{wf {&quot;path&quot;:&quot;author:slug&quot;,&quot;type&quot;:&quot;PlainText&quot;\} }}#author",
      "name": "{{wf {&quot;path&quot;:&quot;author:name&quot;,&quot;type&quot;:&quot;PlainText&quot;\} }}",
      "url": "https://www.getcoconut.com/author/{{wf {&quot;path&quot;:&quot;author:slug&quot;,&quot;type&quot;:&quot;PlainText&quot;\} }}",
      "image": "{{wf {&quot;path&quot;:&quot;author:picture&quot;,&quot;type&quot;:&quot;ImageRef&quot;\} }}",
      "jobTitle": "{{wf {&quot;path&quot;:&quot;author:position-and-company&quot;,&quot;type&quot;:&quot;PlainText&quot;\} }}",
      "description": "{{wf {&quot;path&quot;:&quot;author:bio-summary&quot;,&quot;type&quot;:&quot;PlainText&quot;\} }}",
      "sameAs": ["{{wf {&quot;path&quot;:&quot;author:linkedin-url&quot;,&quot;type&quot;:&quot;Link&quot;\} }}"]
    },
    "publisher": {
      "@id": "https://www.getcoconut.com/#organization"
    },
    "articleSection": "{{wf {&quot;path&quot;:&quot;category:name&quot;,&quot;type&quot;:&quot;PlainText&quot;\} }}",
    "inLanguage": "en-GB"
  }
</script>

<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "@id": "https://www.getcoconut.com/knowledge-hub/{{wf {&quot;path&quot;:&quot;slug&quot;,&quot;type&quot;:&quot;PlainText&quot;\} }}#breadcrumb",
    "itemListElement": [
      {
        "@type": "ListItem",
        "position": 1,
        "name": "Home",
        "item": "https://www.getcoconut.com/"
      },
      {
        "@type": "ListItem",
        "position": 2,
        "name": "{{wf {&quot;path&quot;:&quot;category:name&quot;,&quot;type&quot;:&quot;PlainText&quot;\} }}",
        "item": "https://www.getcoconut.com/knowledge-hub"
      },
      {
        "@type": "ListItem",
        "position": 3,
        "name": "{{wf {&quot;path&quot;:&quot;name&quot;,&quot;type&quot;:&quot;PlainText&quot;\} }}"
      }
    ]
  }
</script>
