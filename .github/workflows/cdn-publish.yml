# Builds dist/ from the tags of the clients in tools/release/cdn-config.json, guards it against the live manifest and deploys it to the zissou-cdn Cloudflare Pages project.
name: CDN publish

on:
  workflow_dispatch:
    inputs:
      allow_changes:
        description: Allow changed or removed paths against the live manifest
        type: boolean
        default: false
      bootstrap:
        description: Treat a 404 live manifest as empty (first publish only)
        type: boolean
        default: false

concurrency:
  group: cdn-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Test
        run: npm run test:release

      - name: Build
        run: npm run cdn:build

      - name: Check live manifest
        env:
          BOOTSTRAP: ${{ inputs.bootstrap }}
          ALLOW_CHANGES: ${{ inputs.allow_changes }}
        run: node tools/release/cdn-build.js --check-live --bootstrap="$BOOTSTRAP" --allow-changes="$ALLOW_CHANGES"

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=zissou-cdn --branch=main
