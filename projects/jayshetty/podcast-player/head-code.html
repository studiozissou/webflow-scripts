<!-- Include the YouTube iframe API script -->
<script src="https://www.youtube.com/iframe_api"></script>
<script type="text/javascript" src="https://cdn.embed.ly/player-0.1.0.min.js"></script>
<!-- Spotify iFrame API (podcast inline player). The ready stub must be defined
     before the API script so the callback is never missed. Loaded in every
     browser — Safari takes the same API + /video path as Chrome. -->
<script>
  window.onSpotifyIframeApiReady = function (api) {
    window.__spotifyIframeApi = api;
    document.dispatchEvent(new CustomEvent("spotify-api-ready"));
  };
  var spotifyApiScript = document.createElement("script");
  spotifyApiScript.src = "https://open.spotify.com/embed/iframe-api/v1";
  spotifyApiScript.async = true;
  document.head.appendChild(spotifyApiScript);
</script>
<!-- Link Swiper's CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />


<style>
.swiper-pagination-bullet-active {
    background-color: #000!important;
}
.swiper-pagination-bullet {
    width: 8px;
    height: 8px;
    background-color: transparent;
    border: 1px solid #000;
    opacity: 1;
}
.swiper-pagination {
position: relative;
}
.visible {
    opacity: 1;
}

.podcast-player-embed{
	opacity:1;
}
.podcasts_video-wrapper{
cursor:pointer;
}
 .button.is-link.is-podcast-pause-button{
   display:none;
		position: relative;
    top: -15px;
}
.is-podcast-pause-button svg {
    width: 10px;
}
.show-btn + .podcasts_video-wrapper .is-podcast-pause-button  {
    display: flex;
}
.show-btn .button.is-link.is-podcast-watch-button {
    display: none;
}
.showvideo .podcast-list-youtube-embed {
    z-index: 2;
}
.videoplay .podcast-list-youtube-embed {
    z-index: 2;
}
/* The Designer class still carries display:none from when the embed was
   broken — restore parity with the YouTube embed. Webflow's conditional
   visibility (w-condition-invisible, !important) still hides it on
   YouTube-era items. */
.podcast-list-spotify-embed.is-cover {
    display: block;
}
/* Mirror the YouTube z-index rules for the Spotify embed */
.showvideo .podcast-list-spotify-embed,
.videoplay .podcast-list-spotify-embed {
    z-index: 2;
}
/* Spotify controller iframe fills the cover slot */
.podcast-list-spotify-embed iframe {
    width: 100%;
    height: 100%;
}
/* Spotify's embed rounds its corners internally (transparent corners we
   can't square off), so hide the cover art once the player is visible to
   stop it peeking through */
.podcasts_image-wrapper:has(.podcast-list-spotify-embed.visible) .image-cover {
    opacity: 0;
}
@media screen and (max-width: 679px){
	.swiper-pagination {
		display: none;
}
}
</style>
