<!-- In-canvas Embed on the Vehicles template (not in page settings). Supplied by Will, 16 Sep 2026. Shows the cold-traffic Swiper banner when utm_source is a listed marketplace and the car has 3+ make/model siblings. Covered by carsa-vdp-script-externalisation.spec.js "Cold Banner". -->
<script>
(function () {
  const onReady = (fn) => (window.jQuery ? jQuery(fn) : document.addEventListener("DOMContentLoaded", fn));

  const loadCSS = (href) => {
    if ([...document.styleSheets].some(s => s.href === href)) return Promise.resolve();
    return new Promise(r => {
      const l = document.createElement("link");
      l.rel = "stylesheet";
      l.href = href;
      l.onload = r;
      document.head.appendChild(l);
    });
  };

  const loadJS = (src) => {
    if (window.Swiper) return Promise.resolve();
    return new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = src;
      s.async = true;
      s.onload = res;
      s.onerror = rej;
      document.head.appendChild(s);
    });
  };

  onReady(function () {
    const banner = document.querySelector(".section_vdp-cold-banner");
    const usp = document.querySelector("#section_usp-carousel, .section_usp-carousel");
    const promoBanner = document.querySelector(".vdp_promo-banner");
    const count = document.querySelectorAll('[data-count="make-model"]').length; // count items

    // Exit if no make-model items
    if (count < 3) {
      if (banner) banner.style.display = "none";
      return;
    }

    // Get utm_source (case-insensitive)
    const utm = new URLSearchParams(location.search).get("utm_source")?.toLowerCase() || "";

    // List of allowed sources
    const validSources = [
      "autotrader.co.uk",
      "google_vehicle_ads",
      "chat",
      "google",
      "ebaymotorsgroup",
      "theaa.com",
      "carwow.co.uk",
      "cargurus.co.uk"
    ];

    const isMatch = validSources.some(src => utm === src);

    // Hide banner by default
    if (banner) banner.style.display = "none";

    // Exit if not matching
    if (!isMatch) return;

    // Hide USP + promo
    if (usp) usp.style.display = "none";
    //if (promoBanner) promoBanner.style.display = "none";

    // Move banner after USP
    if (usp && banner && usp.parentNode) usp.parentNode.insertBefore(banner, usp.nextSibling);

    // Show banner
    banner.style.display = "flex";

    // Load Swiper + init
    Promise.all([
      loadCSS("https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"),
      loadJS("https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js")
    ]).then(() => {
      new Swiper("#cold-banner-carousel", {
        slidesPerView: "auto",
        centeredSlides: true,
        grabCursor: true,
        slideToClickedSlide: true,
        loop: true,
        loopAdditionalSlides: 0,
        speed: 250,
        autoplay: { enabled: false, delay: 1100, pauseOnMouseEnter: true },
        wrapperClass: "vdp-cold-banner_list",
        slideClass: "vdp-cold-banner_item",
        observer: true,
        observeParents: true,
        touchRatio: 1,
        freeMode: { enabled: false, sticky: true },
        lazy: { enabled: true },
        navigation: { nextEl: "#cold-banner-right", prevEl: "#cold-banner-left" },
        breakpoints: { 992: { centeredSlides: false, speed: 350, autoplay: { enabled: true, delay: 1100 } } }
      });
    }).catch(console.error);
  });
})();
</script>
