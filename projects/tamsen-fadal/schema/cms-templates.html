<!--
  CMS TEMPLATE SCHEMA — bound to REAL Webflow field slugs
  =======================================================
  Every binding below was read from the live collection schema via Webflow MCP on
  2026-08-06, not assumed. Field display names are given so you can find them in the
  Designer picker.

  WHERE: each block goes on its Collection Page template →
         Page Settings → Custom Code → Inside <head> tag

  HOW TO BIND: type "+" in the custom code box and choose the field from the picker.
  The +{{Field Name}} tokens below show WHICH field to pick — they do not work if
  pasted literally.

  ⚠️ Escaping: only bind Plain Text fields into JSON string positions. Rich Text
  will inject HTML and break the JSON. Where a field can contain a double quote
  (episode and post titles often do), Webflow escapes it for you in the head context,
  but validate one real item after binding before publishing the lot.

  Requires: sitewide-graph.html live in SITE head code, so #person / #publisher /
  #website resolve.
-->


<!-- ══════════════════════════════════════════════════════════════════════
     1. PODCAST EPISODES  →  /podcast/[slug]
     Collection: "Podcast Episodes" (68a5993943f9f66c9d22b4b7)
     Template page: "Podcast Episodes Template" (detail_podcast)

     100 pages, currently ZERO schema. Biggest single gap on the site.

     Real fields used:
       name              → Name
       slug              → Slug
       short-description → Short Description   (Plain Text)
       featured-image    → Featured Image
       release-date      → Release Date        (DateTime)
       episode-number    → Episode Number      (Number)
       guest             → Guest               (Plain Text)
       keywords          → Keywords            (Plain Text)
       video-link        → Video link

     NOTE ON GUEST: bind "guest" to the actor field. The old hardcoded episode array
     on /podcast credited the wrong guest on one episode precisely because it was
     hand-written. If Guest is empty for an item, Webflow renders an empty string —
     acceptable, but consider making Guest required.
     ══════════════════════════════════════════════════════════════════════ -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "PodcastEpisode",
      "@id": "https://www.tamsenfadal.com/podcast/+{{Slug}}#episode",
      "name": "+{{Name}}",
      "description": "+{{Short Description}}",
      "image": "+{{Featured Image}}",
      "datePublished": "+{{Release Date}}",
      "episodeNumber": "+{{Episode Number}}",
      "url": "https://www.tamsenfadal.com/podcast/+{{Slug}}",
      "keywords": "+{{Keywords}}",
      "partOfSeries": { "@id": "https://www.tamsenfadal.com/podcast#podcast" },
      "author": { "@id": "https://www.tamsenfadal.com/#person" },
      "publisher": { "@id": "https://www.tamsenfadal.com/#publisher" },
      "inLanguage": "en",
      "actor": { "@type": "Person", "name": "+{{Guest}}" }
    },
    {
      "@type": "BreadcrumbList",
      "@id": "https://www.tamsenfadal.com/podcast/+{{Slug}}#breadcrumb",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.tamsenfadal.com/" },
        { "@type": "ListItem", "position": 2, "name": "Podcast", "item": "https://www.tamsenfadal.com/podcast" },
        { "@type": "ListItem", "position": 3, "name": "+{{Name}}", "item": "https://www.tamsenfadal.com/podcast/+{{Slug}}" }
      ]
    }
  ]
}
</script>


<!-- ══════════════════════════════════════════════════════════════════════
     2. BLOG POSTS  →  /blog/[slug]
     Collection: "Blogs" (68bede1a5ef125759435c0e1)
     Template page: "Blogs Template" (detail_blog)

     ⚠️ REPLACEMENT, NOT AN ADDITION — 250 pages already emit a BlogPosting block.
     Delete the existing one or every post carries two competing Article nodes.

     What the live block gets wrong:
       1. author is an INLINE Person, not a reference to #person. Google sees an
          unconnected "Tamsen Fadal" on all 250 posts. Largest source of entity
          fragmentation on the site — fixing this is the highest-leverage change here.
       2. publisher is typed Person; it should be the Organization.
       3. No BreadcrumbList, no isPartOf → #website.

     Real fields used:
       name              → Name
       slug              → Slug
       short-description → Short Description   (Plain Text)
       hero-image        → Hero Image
       publication-date  → Publication Date    (DateTime)
       main-topic        → Main Topic          (Reference → Blog Topics)

     ⚠️ There is NO "updated date" field on this collection. dateModified therefore
     reuses Publication Date. Do not invent one — a dateModified that never changes is
     better than one that is wrong. Add a real field later if freshness matters.

     ⚠️ There is NO keywords field on Blogs (Keywords exists on Podcast Episodes, not
     here). "about" uses Main Topic instead, plus the MedicalCondition the live block
     already asserts, which is worth keeping.
     ══════════════════════════════════════════════════════════════════════ -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "BlogPosting",
      "@id": "https://www.tamsenfadal.com/blog/+{{Slug}}#article",
      "headline": "+{{Name}}",
      "description": "+{{Short Description}}",
      "image": "+{{Hero Image}}",
      "datePublished": "+{{Publication Date}}",
      "dateModified": "+{{Publication Date}}",
      "url": "https://www.tamsenfadal.com/blog/+{{Slug}}",
      "author": { "@id": "https://www.tamsenfadal.com/#person" },
      "publisher": { "@id": "https://www.tamsenfadal.com/#publisher" },
      "inLanguage": "en-US",
      "isPartOf": { "@id": "https://www.tamsenfadal.com/#website" },
      "mainEntityOfPage": "https://www.tamsenfadal.com/blog/+{{Slug}}",
      "about": [
        { "@type": "MedicalCondition", "name": "Menopause" },
        { "@type": "Thing", "name": "+{{Main Topic}}" }
      ]
    },
    {
      "@type": "BreadcrumbList",
      "@id": "https://www.tamsenfadal.com/blog/+{{Slug}}#breadcrumb",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.tamsenfadal.com/" },
        { "@type": "ListItem", "position": 2, "name": "Blog", "item": "https://www.tamsenfadal.com/blog" },
        { "@type": "ListItem", "position": 3, "name": "+{{Name}}", "item": "https://www.tamsenfadal.com/blog/+{{Slug}}" }
      ]
    }
  ]
}
</script>


<!-- ══════════════════════════════════════════════════════════════════════
     3. EVENTS  →  /events/[slug]
     Collection: "Events / Events" (68d65c61db60f21e8489ce00)
     Template page: "Events / Events Template" (detail_events)

     Real fields used:
       name     → Name
       slug     → Slug
       image    → Image
       date-day → Date Start   (DateTime)
       date-end → Date End     (DateTime)
       address  → Address      (Plain Text)
       link     → Link

     ⚠️ ADDRESS IS A SINGLE PLAIN-TEXT FIELD. There is no separate venue name, city,
     region or postcode, so location cannot be expressed as a structured PostalAddress.
     Place.address takes the raw string, which Google accepts. Splitting the CMS field
     into venue/street/city/region/postcode would produce noticeably better Event rich
     results — worth proposing as a small follow-up.

     ⚠️ NO TICKET URL OR PRICE FIELD EXISTS, so "offers" is deliberately omitted.
     Rich Results Test flags "missing field offers (optional)" — that is expected and
     non-blocking. Do not fabricate a price to silence it. Adding a Ticket URL field to
     the collection would clear it honestly.

     ⚠️ Date Start is required for Event rich results. Items with an empty Date Start
     will warn. Consider making it required in the collection.
     ══════════════════════════════════════════════════════════════════════ -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Event",
      "@id": "https://www.tamsenfadal.com/events/+{{Slug}}#event",
      "name": "+{{Name}}",
      "image": "+{{Image}}",
      "startDate": "+{{Date Start}}",
      "endDate": "+{{Date End}}",
      "eventStatus": "https://schema.org/EventScheduled",
      "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
      "location": {
        "@type": "Place",
        "name": "+{{Address}}",
        "address": "+{{Address}}"
      },
      "performer": { "@id": "https://www.tamsenfadal.com/#person" },
      "organizer": { "@id": "https://www.tamsenfadal.com/#publisher" },
      "url": "https://www.tamsenfadal.com/events/+{{Slug}}"
    },
    {
      "@type": "BreadcrumbList",
      "@id": "https://www.tamsenfadal.com/events/+{{Slug}}#breadcrumb",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.tamsenfadal.com/" },
        { "@type": "ListItem", "position": 2, "name": "Events", "item": "https://www.tamsenfadal.com/events" },
        { "@type": "ListItem", "position": 3, "name": "+{{Name}}", "item": "https://www.tamsenfadal.com/events/+{{Slug}}" }
      ]
    }
  ]
}
</script>


<!-- ══════════════════════════════════════════════════════════════════════

     Collection: "Education Hub / Resources" (68d6721d9e5d8910c339845c)
     Template page: "Education Hub / Resources Template"

     ⚠️ UPGRADE, NOT AN ADDITION — 16 pages already emit a bare WebPage block with no
     author, no publisher and no link to the entity graph. Replace it with this.

       name              → Name
       slug              → Slug
       short-description → Short Description   (Plain Text)

       publication-date  → Publication Date    (DateTime)

<!-- ══════════════════════════════════════════════════════════════════════
     5. SHOP COLLECTIONS  →  /shop/[slug]
     Collection: "Shop Collections" (68e51ac42e78266cb3fa2813)
     Template page: "Shop Collections Template" (detail_shop)

     ⚠️ TYPE DECISION — these are NOT products.

     The collection's fields are "Shopmy Collection ID" and "Amazon Link" — these are
     curated AFFILIATE collections, not goods sold by Tamsen. Marking them up as
     Product with an Offer would assert a price and availability she does not control,
     which is both inaccurate and a Google merchant-policy risk.

     CollectionPage is the honest type. Do NOT "upgrade" this to Product later without
     confirming she actually sells the items.

     Real fields used:
       name             → Collection Name
       slug             → Slug
       description      → Description        (Plain Text)
       featured-image   → Featured Image
       publication-date → Publication Date   (DateTime)
     ══════════════════════════════════════════════════════════════════════ -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "CollectionPage",
      "@id": "https://www.tamsenfadal.com/shop/+{{Slug}}#webpage",
      "name": "+{{Collection Name}}",
      "description": "+{{Description}}",
      "image": "+{{Featured Image}}",
      "datePublished": "+{{Publication Date}}",
      "url": "https://www.tamsenfadal.com/shop/+{{Slug}}",
      "inLanguage": "en-US",
      "isPartOf": { "@id": "https://www.tamsenfadal.com/#website" },
      "about": { "@id": "https://www.tamsenfadal.com/#person" },
      "breadcrumb": { "@id": "https://www.tamsenfadal.com/shop/+{{Slug}}#breadcrumb" }
    },
    {
      "@type": "BreadcrumbList",
      "@id": "https://www.tamsenfadal.com/shop/+{{Slug}}#breadcrumb",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.tamsenfadal.com/" },
        { "@type": "ListItem", "position": 2, "name": "Shop", "item": "https://www.tamsenfadal.com/shop" },
        { "@type": "ListItem", "position": 3, "name": "+{{Collection Name}}", "item": "https://www.tamsenfadal.com/shop/+{{Slug}}" }
      ]
    }
  ]
}
</script>
